<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3 class="home-heading">HOME</h3>
                <div class="home-score"><span class="home-points-text" id="home-points-text">0</span>
                </div>
                <button id="btn-home-1" onclick="one()">+1</button>
                <button id="btn-home-2" onclick="two()">+2</button>
                <button id="btn-home-3" onclick="three()">+3</button>
                <div>
                <button id="btn-save-home" onclick="saveHome()">Save</button>
                </div>
                <div>
                <button id="btn-revert-home" onclick="revert()">⟲</button>
                </div>
              <p class="previous-entries-home" id="save-el-home">Previous Entries:&nbsp;</p>
            </div>
            <div>
                <h3 class="guest-heading">GUEST</h3>
                <div class="guest-score"><span class="guest-points-text" id="guest-points-text">0</span>
                </div>
                <button id="btn-guest-1" onclick="oneGuest()">+1</button>
                <button id="btn-guest-2" onclick="twoGuest()">+2</button>
                <button id="btn-guest-3" onclick="threeGuest()">+3</button>
                <div>
                <button id="btn-save-guest" onclick="saveGuest()">Save</button>
                </div>
                <div>
                <button id="btn-revert-guest" onclick="revertGuest()">⟲</button>
                </div>
                <p class="previous-entries-guest" id="save-el-guest">Previous Entries:&nbsp;</p>
              
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
